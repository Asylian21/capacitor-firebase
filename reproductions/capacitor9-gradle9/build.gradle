buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

ext {
    compileSdkVersion = 37
    targetSdkVersion = 37
    minSdkVersion = 26
    junitVersion = '4.13.2'
    androidxAppCompatVersion = '1.7.1'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
}
